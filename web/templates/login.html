{{define "login"}}
{{template "header" .}}
  <div class="hero-glow mx-auto flex min-h-[70vh] max-w-md flex-col justify-center pt-4">
    <div class="animate-rise">
      <div class="flex items-center gap-3">
        <span class="logo-mark h-10 w-10" aria-hidden="true">
          <svg viewBox="0 0 32 32" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 10l-5 6 5 6M19 10l5 6-5 6"/>
          </svg>
        </span>
        <div>
          <h1 class="text-2xl font-semibold tracking-tight">DSA Tracker</h1>
          <p class="text-sm text-muted">Private instance · owner only</p>
        </div>
      </div>

      <form method="post" action="/login" class="card mt-7">
        <input type="hidden" name="next" value="{{.Next}}">
        <label class="field-label" for="password">Password</label>
        <div class="relative">
          <input class="input pr-11" type="password" id="password" name="password"
                 autocomplete="current-password" autofocus required minlength="8"
                 placeholder="Enter your password">
          <button class="btn btn-icon absolute right-1 top-1/2 -translate-y-1/2" type="button"
                  data-toggle-password aria-label="Show password">
            <svg data-eye="on" viewBox="0 0 24 24" class="h-4.5 w-4.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12s-3.5 6.5-9.5 6.5S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.75"/>
            </svg>
            <svg data-eye="off" viewBox="0 0 24 24" class="hidden h-4.5 w-4.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 3l18 18M10.6 6.2A9.9 9.9 0 0 1 12 6c6 0 9.5 6 9.5 6a17 17 0 0 1-3.4 4M6.3 8.3A16.6 16.6 0 0 0 2.5 12s3.5 6 9.5 6a9.6 9.6 0 0 0 3.7-.7"/>
            </svg>
          </button>
        </div>

        {{if .Error}}<p class="mt-3 text-sm text-danger">{{.Error}}</p>{{end}}

        <button class="btn btn-primary btn-lg btn-block mt-5" type="submit">
          Sign in
          <kbd class="kbd">↵</kbd>
        </button>

        <p class="mt-4 text-center text-xs text-muted">
          Deterministic daily sets · question bank seeded from Excel
        </p>
      </form>
    </div>
  </div>
{{template "footer" .}}
{{end}}
