services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dsa_tracker
      POSTGRES_USER: dsa
      POSTGRES_PASSWORD: dsa_local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsa -d dsa_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
